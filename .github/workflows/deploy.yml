# Build, teste e deploy do Themis no cluster Olympus.
#
# O manifest NÃO mora aqui, mora no `infra-olympus` (`k8s/themis.yaml`): aquele
# repositório é a fonte de verdade do que roda no cluster, e alguém lendo só ele
# precisa conseguir enxergar todos os serviços. Este workflow só troca a imagem
# de um Deployment que já existe.
#
# Consequência: a PRIMEIRA aplicação do manifest é manual, a partir do
# infra-olympus. Daí em diante o deploy é este workflow.
#
# O que este pipeline deliberadamente NÃO faz: publicar a base de 34,2 GB. Ela
# é construída na estação e enviada por `python -m src.publicacao.enviar`, que
# para o pod, apaga a base e descompacta a nova. Isso é decisão humana, não
# gatilho de push. Ver THEMIS.md no infra-olympus.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # A página em `/` é compilada NA IMAGEM (estágio `site` do Dockerfile) e
      # servida pela API. Sem esta linha, uma mudança só no site nunca ia ao
      # ar: o CEP-XRay já tinha, este não.
      - "site/**"
      - "Dockerfile"
      - "docker/**"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  # Dois deploys simultâneos brigariam pelo mesmo Deployment, e o Recreate do
  # manifest derrubaria o pod duas vezes. Fila, sem cancelar o que está no ar.
  group: deploy-themis
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instala
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .
          python -m pip install --quiet pytest httpx

      # Os 182 testes não tocam Firebird nem rede: a troca blue-green é
      # renomeação de arquivo, a leitura opera sobre bytes e as rotas rodam com
      # a consulta injetada. Por isso cabem no CI sem infraestrutura nenhuma.
      - name: Testes
        run: python -m pytest -q

  build-e-deploy:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        run: |
          docker build \
            -t ghcr.io/robsonrbranco/cnpj-xray:${{ github.sha }} \
            -t ghcr.io/robsonrbranco/cnpj-xray:latest .
          docker push ghcr.io/robsonrbranco/cnpj-xray:${{ github.sha }}
          docker push ghcr.io/robsonrbranco/cnpj-xray:latest

      - uses: azure/setup-kubectl@v5

      - name: Deploy
        run: |
          echo "${{ secrets.KUBECONFIG_OLYMPUS }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          # OS DOIS containers, não só o `themis`. O pod roda a API pública e
          # o /manager a partir da MESMA imagem, com comandos diferentes.
          # `set image` atualiza container por nome: esquecer o `manager` aqui
          # o deixaria preso na tag do manifest enquanto a API avança, e os
          # dois passariam a ler o mesmo SQLite com códigos de versões
          # diferentes — divergência que só apareceria em gestão de credencial,
          # meses depois.
          kubectl -n olympus set image deployment/themis \
            themis=ghcr.io/robsonrbranco/cnpj-xray:${{ github.sha }} \
            manager=ghcr.io/robsonrbranco/cnpj-xray:${{ github.sha }}
          # 300s e não 120s: a strategy é Recreate, então o pod antigo morre
          # antes de o novo subir, e o novo só fica ready depois de abrir o
          # attachment ao Firebird -- que custa ~530 ms.
          kubectl -n olympus rollout status deployment/themis --timeout=300s
          rm kubeconfig.yaml

      - name: Confere o que ficou no ar
        # ESTE PASSO NÃO VERIFICA O DEPLOY — o `rollout status` acima já fez
        # isso, e fez melhor: a readiness do pod É um GET em /saude, então um
        # rollout que conclui prova que a aplicação subiu e alcançou a base.
        #
        # O que se verifica aqui é o CAMINHO PÚBLICO: DNS, Cloudflare, ingress
        # e Service. É outra falha, com outra causa, e merece outra mensagem.
        #
        # Por isso a distinção abaixo entre "o host não resolve" e "o host
        # resolve e responde errado". A primeira é infraestrutura de DNS ainda
        # não provisionada (ou fora do ar por outro motivo alheio a este
        # deploy), e reprovar o CI por causa dela deixaria o pipeline vermelho
        # por um motivo que não tem nada a ver com o que foi entregue — e CI
        # vermelho que todo mundo aprende a ignorar é pior que CI nenhum. A
        # segunda é quebra de verdade e reprova.
        run: |
          HOST=themis.ecomciencia.com
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::$HOST ainda não resolve — o deploy está no ar no \
          cluster (o rollout confirmou a readiness, que bate em /saude), mas o \
          caminho público não foi verificado. Falta o registro DNS."
            exit 0
          fi

          # Não basta o rollout terminar: o pod pode estar de pé servindo a
          # competência errada, se a base em /cnpj-xray-fdb tiver sido trocada
          # por engano. O /saude diz qual base está em disco.
          resposta=$(curl -sf --max-time 30 "https://$HOST/saude") || {
            echo "::error::$HOST resolve mas /saude não respondeu"
            exit 1
          }
          echo "$resposta"
          echo "$resposta" | grep -q '"status":"ok"' || {
            echo "::error::/saude não respondeu ok"
            exit 1
          }
          competencia=$(echo "$resposta" | grep -o '"competencia":"[^"]*"' | cut -d'"' -f4)
          echo "::notice::Themis no ar servindo a competência ${competencia:-desconhecida}"
