[project]
name = "cnpj-xray"
version = "0.1.0"
description = "CNPJ-XRay - ETL e análise dos dados públicos de CNPJ da Receita Federal do Brasil"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "firebird-driver>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "polars>=1.42.1",
]

# httpx, beautifulsoup4, lxml e tenacity saíram junto com o ETL PostgreSQL: o
# download atual (src/etl/download.py) usa só a stdlib, e não há mais scraping
# da página da Receita — a listagem vem do PROPFIND do WebDAV.
#
# "pathlib" também saiu: era dependência de um pacote do PyPI homônimo, um
# backport abandonado que sombreia o módulo da stdlib.

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes nao tocam em Firebird nem em rede: a troca blue-green e renomeacao
# de arquivo, e a leitura opera sobre bytes. Rodam em menos de um segundo, o
# que so vale dizer porque a alternativa para validar este codigo era uma carga
# de seis horas.
addopts = "-q"
